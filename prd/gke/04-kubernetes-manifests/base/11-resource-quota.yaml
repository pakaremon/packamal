apiVersion: v1
kind: ResourceQuota
metadata:
  name: packamal-resource-quota
spec:
  hard:
    # Tuned for a small app node pool (e2-standard-4 class).
    # Keep requests under node allocatable (CPU ~3920m, Mem ~13Gi) to avoid Pending pods.
    requests.cpu: "3600m"
    requests.memory: "12Gi"
    # Limits can be higher to allow burst/overcommit, but keep reasonable for stability.
    limits.cpu: "8"
    limits.memory: "16Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: packamal-limit-range
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
