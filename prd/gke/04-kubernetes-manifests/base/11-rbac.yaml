apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-serviceaccount
  annotations:
    iam.gke.io/gcp-service-account: packamal-gke@${PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-job-creator
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-job-creator-binding
subjects:
  - kind: ServiceAccount
    name: backend-serviceaccount
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: backend-job-creator
  apiGroup: rbac.authorization.k8s.io
