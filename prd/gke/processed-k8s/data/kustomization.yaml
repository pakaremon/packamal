apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: packamal
resources:
  - 02-pvc.yaml
  - 03-postgres.yaml
  - 04-redis.yaml

patches:
  - target:
      kind: Deployment
      labelSelector: "app in (database, redis-celery, redis-report)"
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          role: app-node