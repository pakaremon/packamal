apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-celery
  labels:
    app: redis-celery
spec:
  replicas: 1
  # QUAN TRỌNG: Dùng Recreate để tránh lỗi Multi-Attach với PVC RWO
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-celery
  template:
    metadata:
      labels:
        app: redis-celery
    spec:
      # Đảm bảo PriorityClass này đã tồn tại trong cluster, nếu chưa thì xóa dòng này
      priorityClassName: packamal-high-priority
      
      # Security Context cấp Pod để hỗ trợ quyền ghi file
      securityContext:
        fsGroup: 999        # Gid của redis
        runAsUser: 999      # Uid của redis
        runAsGroup: 999
        runAsNonRoot: true

      # Init Container: Chạy dưới quyền root để cấp quyền ghi cho thư mục /data
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ['sh', '-c', 'chown -R 999:999 /data']
          securityContext:
            runAsUser: 0    # Cần root để chown
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"

      containers:
        - name: redis
          image: redis:7-alpine
          # Cấu hình tham số Redis trực tiếp tại đây
          args:
            - redis-server
            - --appendonly
            - "yes"                  # Bật persistence AOF
            - --appendfsync
            - everysec               # Sync mỗi giây (cân bằng hiệu năng/an toàn)
            - --maxmemory
            - 400mb                  # Giới hạn RAM của Redis (nhỏ hơn Limit của Pod)
            - --maxmemory-policy
            - allkeys-lru            # Tự động xóa key ít dùng nhất khi đầy bộ nhớ
          ports:
            - containerPort: 6379
              name: redis
          
          # Resource Limits: Đảm bảo Redis không ăn hết RAM của Node
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"            # Tăng nhẹ CPU limit để xử lý spike khi nhiều request
              memory: "512Mi"        # Dư 112MB so với maxmemory để dành cho overhead OS
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Redis cần ghi file tạm
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: redis-data
              mountPath: /data

          # Health Checks
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-celery-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis-celery
  labels:
    app: redis-celery
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis-celery
  type: ClusterIP