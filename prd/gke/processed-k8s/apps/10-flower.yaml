apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: packamal-dev
spec:
  replicas: 0
  selector:
    matchLabels:
      app: flower
  template:
    metadata:
      labels:
        app: flower
    spec:
      containers:
        - name: flower
          image: us-central1-docker.pkg.dev/k8s-packamal/packamal-repo/backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5555
              name: flower
          envFrom:
            - configMapRef:
                name: packamal-config
            - secretRef:
                name: packamal-secrets
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z redis-celery 6379; do
                echo "Waiting for Redis Celery..."
                sleep 2
              done
              until nc -z database 5432; do
                echo "Waiting for database..."
                sleep 2
              done
              unset FLOWER_PORT
              exec celery -A packamal flower --port=5555
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5555
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flower
  namespace: packamal-dev
spec:
  selector:
    app: flower
  ports:
    - name: flower
      port: 5555
      targetPort: 5555
  type: ClusterIP
