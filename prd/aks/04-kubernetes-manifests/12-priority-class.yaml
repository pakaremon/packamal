apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: packamal-high-priority
value: 1000000
globalDefault: false
description: "High priority for stateful core services (Postgres, Redis) so they are least likely to be preempted/evicted."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: packamal-app-priority
value: 500000
globalDefault: false
description: "App priority for Backend and analysis-related workers."

