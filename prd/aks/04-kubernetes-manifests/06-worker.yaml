apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: packamal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      serviceAccountName: backend-serviceaccount
      priorityClassName: packamal-app-priority
      containers:
        - name: celery-worker
          # Reuses the backend image; runs the Celery worker consuming Redis jobs.
          image: packamalacr.azurecr.io/packamal-backend:latest
          imagePullPolicy: Always  # Use Always for production or specific tags
          envFrom:
            - configMapRef:
                name: packamal-config
            - secretRef:
                name: packamal-secrets
          # Override the image ENTRYPOINT (which runs migrations/collectstatic) to avoid N workers racing on startup.
          # Still waits for Postgres before starting.
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z database 5432; do
                echo "Waiting for database..."
                sleep 0.5
              done
              exec celery -A packamal worker -l info -n worker@%h -Q analysis,maintenance --concurrency=4
          resources:
            requests:
              cpu: "100m"     # Giảm xuống để tiết kiệm CPU requests
              memory: "384Mi" # Giảm memory request
            limits:
              cpu: "300m"     # Giảm limits để chừa chỗ cho 1 heavy job (2 CPU)
              memory: "1Gi"   # Đủ để chạy ổn định các task quản lý

